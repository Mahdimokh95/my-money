<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Money</title>
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Money">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <button id="back" class="iconbtn" data-act="back" aria-label="Back" hidden>‹</button>
    <h1 id="title">My Money</h1>
    <button id="hdrAction" class="link strong" hidden></button>
  </header>

  <main id="main"><div class="empty">Loading…</div></main>

  <nav class="bottom">
    <button data-act="go" data-v="home"><span>🏠</span>Home</button>
    <button data-act="go" data-v="history"><span>📜</span>History</button>
    <button class="add" data-act="newTx" aria-label="Add transaction">＋</button>
    <button data-act="go" data-v="reports"><span>📊</span>Reports</button>
    <button data-act="go" data-v="more"><span>☰</span>More</button>
  </nav>

  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
